<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>역도 타이머</title>
<style>
  :root { --bg:#fff; --fg:#111; --dim:#9a9a9a; --line:#d9d9d9; --hi:#ffe27a; --hi-fg:#111; --ok:#1f8a3b; --warn:#f08a00; --bad:#d8201a; --panel:#f4f4f4; }
  body.dark { --bg:#0e0e10; --fg:#f2f2f2; --dim:#6d6d73; --line:#2a2a2e; --hi:#5a4a00; --hi-fg:#fff; --panel:#1a1a1d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  #app { display:flex; width:100vw; height:100vh; }
  :root { --lw:40vw; }
  #left { width:var(--lw); } #right { width:calc(100vw - var(--lw)); }
  #left,#right { height:100vh; padding:2vh 1.6vw; display:flex; flex-direction:column; }
  #left { border-right:.4vh solid var(--line); }

  /* 좌측 */
  #top { display:flex; align-items:center; gap:1vw; white-space:nowrap; }
  #date { font-size:4.6vh; font-weight:800; }
  body.rehearsal #date::after { content:" 리허설"; font-size:2.4vh; font-weight:800; color:var(--bad); margin-left:.6vw; }
  #chip { font-size:2.8vh; font-weight:800; background:var(--fg); color:var(--bg); padding:.3vh 1vw; border-radius:5vh; }
  #rng { margin-left:auto; font-size:3.2vh; font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; }
  #title { display:flex; justify-content:space-between; align-items:baseline; font-size:2.6vh; color:var(--dim); padding:.6vh 0 1vh; }
  #pcount { font-weight:700; font-variant-numeric:tabular-nums; }
  #prog { height:1vh; background:var(--panel); border-radius:.5vh; overflow:hidden; }
  #prog i { display:block; height:100%; width:0; background:var(--ok); transition:width .4s; }
  #list { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; margin-top:1.4vh; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  #list::-webkit-scrollbar { display:none; }
  #listin { position:relative; padding-bottom:2vh; }
  .card { background:var(--panel); border-radius:1.6vh; padding:.7vh .7vw .6vh; margin-bottom:1.3vh; }
  .bh { display:flex; align-items:baseline; justify-content:space-between; font-size:2.7vh; font-weight:800; padding:.7vh .6vw .5vh; }
  .bh em { font-style:normal; font-size:2.3vh; color:var(--dim); font-weight:700; font-variant-numeric:tabular-nums; }
  .row { display:flex; align-items:center; gap:1vw; padding:.8vh .6vw; border-radius:1.1vh; border:.35vh solid transparent; line-height:1.2; }
  .row .t { width:6.4vw; font-size:2.7vh; color:var(--dim); font-variant-numeric:tabular-nums; }
  .row .w { flex:1; font-size:3.4vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .r { font-size:3.2vh; font-weight:800; white-space:nowrap; }
  .row .k { min-width:6.6vw; text-align:right; font-size:2.2vh; font-weight:800; white-space:nowrap; }
  .row .k b { display:inline-block; padding:.2vh .9vw; border-radius:5vh; font-weight:800; }
  .row.done { opacity:.5; } .row.done .k { color:var(--ok); font-size:3vh; }
  .row.next { background:var(--bg); border-color:var(--fg); } .row.next .k b { border:.3vh solid var(--fg); }
  .row.cur { background:var(--hi); color:var(--hi-fg); } .row.cur .t { color:var(--hi-fg); } .row.cur .k b { background:var(--hi-fg); color:var(--hi); }

  /* 우측 */
  #right { justify-content:space-between; }
  #nowbox { flex:4; min-height:0; display:flex; flex-direction:column; background:var(--hi); color:var(--hi-fg); border-radius:1.4vh; padding:1vh 1.2vw 1.1vh; }
  #nowbox.idle { background:none; color:var(--dim); padding:.4vh 0; }
  #lower { flex:6; min-height:0; display:flex; flex-direction:column; justify-content:space-between; }
  #cur { font-size:8vh; line-height:1.15; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:.9vw; }
  #cur:before { content:'지금'; flex:none; font-size:2.6vh; font-weight:800; background:var(--hi-fg); color:var(--hi); padding:.3vh 1vw; border-radius:5vh; }
  #nowbox.idle #cur { font-size:3vh; font-weight:600; } #nowbox.idle #cur:before { display:none; }
  #curcue { flex:1; min-height:0; margin-top:.8vh; display:flex; align-items:center; overflow:hidden; font-size:5vh; font-weight:700; line-height:1.3; }
  #curcue span { display:block; width:100%; word-break:keep-all; white-space:pre-line; }
  #nextlab { display:flex; align-items:center; gap:.9vw; font-size:2.6vh; font-weight:700; color:var(--fg); margin-top:.4vh; }
  #nextlab:before { content:'다음'; flex:none; font-size:2.3vh; font-weight:800; background:var(--fg); color:var(--bg); padding:.3vh 1vw; border-radius:5vh; }
  #nextlab.last:before { display:none; }
  #nextlab b { color:var(--bad); font-weight:800; margin-left:.8vw; }
  #next { font-size:6vh; font-weight:800; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #main { flex:1; min-height:0; display:flex; flex-direction:column; }
  #cue { flex:1; min-height:0; margin-top:1vh; padding:1.2vh 1.4vw; display:flex; align-items:center; overflow:hidden;
    font-size:5.5vh; font-weight:700; line-height:1.3; background:var(--panel); border-left:1vh solid var(--fg); border-radius:1vh; }
  #cue:empty { background:none; border-left-color:transparent; }
  #cue span { display:block; width:100%; word-break:keep-all; white-space:pre-line; }
  #count { font-size:24vh; white-space:nowrap; overflow:hidden; font-weight:800; line-height:1; text-align:center; font-variant-numeric:tabular-nums; margin:1vh 0; }
  #count.warn { color:var(--warn); } #count.bad { color:var(--bad); }
  #bar { height:2.4vh; background:var(--panel); border-radius:1.2vh; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--ok); }
  #bar.warn i { background:var(--warn); } #bar.bad i { background:var(--bad); }
  #after { display:none; font-size:3vh; margin-top:1.6vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stop { font-size:2.5vh; color:var(--bad); font-weight:700; margin-top:.8vh; line-height:1.25; }
  #ctrl { display:flex; gap:.6vw; margin-top:1.4vh; }
  #ctrl button { flex:1; min-width:0; white-space:nowrap; font:inherit; font-size:2.2vh; padding:1.3vh 0; background:var(--panel); color:var(--fg); border:.3vh solid var(--line); border-radius:1vh; }
  #ctrl button.bk { flex:1.8; font-weight:700; }
  #ctrl button.go { flex:2.2; background:var(--fg); color:var(--bg); font-weight:700; }
  #ctrl button.sm { flex:1; color:var(--dim); }
  #ctrl button:active { opacity:.6; }
  #fin { display:none; text-align:center; }
  #fin b { display:block; font-size:8vh; margin-top:10vh; } #fin span { display:block; font-size:4vh; margin-top:3vh; color:var(--dim); }
  body.ended #main { display:none; } body.ended #fin { display:block; }
  #err { padding:4vh; font-size:4vh; color:var(--bad); }
  #err .item { font-size:2.8vh; color:var(--fg); margin-top:1vh; font-weight:500; }
  #err .eb { font:inherit; font-size:3vh; padding:1.6vh 2vw; margin:3vh 1.5vw 0 0; border-radius:1vh; border:.3vh solid var(--line); background:var(--panel); color:var(--fg); }
  #right { position:relative; }
  #warn { display:none; font-size:2.6vh; font-weight:800; background:var(--bad); color:#fff; padding:.3vh 1vw; border-radius:5vh; }
  #undo { display:none; position:absolute; right:1.6vw; bottom:11.5vh; align-items:center; gap:1.4vw; background:var(--fg); color:var(--bg); padding:1.1vh 1.2vw 1.1vh 1.6vw; border-radius:1.4vh; font-size:2.6vh; font-weight:700; box-shadow:0 .6vh 2vh rgba(0,0,0,.35); }
  #undo button { font:inherit; font-weight:800; background:var(--hi); color:var(--hi-fg); border:0; padding:.9vh 1.6vw; border-radius:1vh; }
</style>
</head>
<body>
<div id="app">
  <section id="left">
    <div id="top"><span id="date">-</span><span id="chip"></span><span id="warn">오늘 아님</span><span id="rng"></span></div>
    <div id="title"><span id="ttl"></span><span id="pcount"></span></div>
    <div id="prog"><i></i></div>
    <div id="list"></div>
  </section>
  <section id="right">
    <div id="main">
      <div id="nowbox"><div id="cur"></div><div id="curcue"></div></div>
      <div id="lower">
        <div><div id="nextlab"></div>
        <div id="next">-</div></div>
        <div id="count">--:--</div>
        <div id="bar"><i></i></div>
        <div id="after"></div>
        <div id="stop"></div>
      </div>
    </div>
    <div id="fin"><b>종료 · 수고하셨습니다</b><span id="finsum"></span></div>
    <div id="undo"><span>시간이 조정됨</span><button id="undoBtn">되돌리기</button></div>
    <div id="ctrl">
      <button data-d="-60">-1분</button>
      <button data-d="60">+1분</button>
      <button data-d="300">+5분</button>
      <button class="bk" id="prev">◀ 이전 세트</button>
      <button class="go" id="go">다음 세트 시작 ▶</button>
      <button class="sm" id="reh">리허설</button>
      <button class="sm" id="imp">파일</button>
      <button class="sm" id="dk">다크</button>
    </div>
  </section>
</div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  // 테마: 주소 인자(?theme=dark|light) > 저장된 선택 > 기본(밝은 배경)
  var theme = Q.get('theme');
  if (!theme) { try { theme = localStorage.getItem('theme'); } catch (e) {} }
  if (theme === 'dark') document.body.classList.add('dark');
  function syncThemeBtn() { var b = document.getElementById('dk'); if (b) b.textContent = document.body.classList.contains('dark') ? '라이트' : '다크'; }
  document.addEventListener('DOMContentLoaded', syncThemeBtn);

  // 가상 시각(리허설용): ?t=07:29:50&speed=10
  var speed = parseFloat(Q.get('speed')) || 1, t0 = Date.now();
  function parseHMS(s) { var p = s.split(':').map(Number); return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0); }
  var virt = Q.get('t') ? parseHMS(Q.get('t')) : null;
  function nowSec() {
    if (virt !== null) return virt + (Date.now() - t0) / 1000 * speed;
    var d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }
  window.__setVirt = function (s) { virt = parseHMS(s); t0 = Date.now(); };   // 디버그용

  var prog = null, off = [], sig = '';

  // 오류 화면: 원인을 보여주고, 앱에서는 "다시 가져오기 / 기본 프로그램 복원" 버튼을 둔다
  function fail(msg, list) {
    var a = document.getElementById('app'); a.innerHTML = '';
    var d = document.createElement('div'); d.id = 'err';
    var h = document.createElement('div'); h.style.fontWeight = '800'; h.textContent = msg; d.appendChild(h);
    (list || []).forEach(function (t) { var x = document.createElement('div'); x.className = 'item'; x.textContent = '· ' + t; d.appendChild(x); });
    if (window.Android) {
      var b1 = document.createElement('button'); b1.className = 'eb'; b1.textContent = '파일 다시 가져오기';
      b1.addEventListener('click', function () { if (Android.importProgram) Android.importProgram(); });
      var b2 = document.createElement('button'); b2.className = 'eb'; b2.textContent = '기본 프로그램으로 복원';
      b2.addEventListener('click', function () { if (Android.resetProgram) Android.resetProgram(); });
      d.appendChild(b1); d.appendChild(b2);
    }
    a.appendChild(d);
  }

  // program.json 형식 검사: 틀린 곳을 한글로 알려 준다 (최대 8개)
  function validate(p) {
    var e = [], HM = /^([01]\d|2[0-3]):[0-5]\d$/;
    if (!p || typeof p !== 'object') return ['최상위가 JSON 객체가 아닙니다'];
    if (!/^\d{4}-\d{2}-\d{2}$/.test(p.date || '')) e.push('date가 YYYY-MM-DD 형식이 아닙니다');
    var endOk = HM.test(p.end || '');
    if (!endOk) e.push('end가 24시간제 HH:MM 형식이 아닙니다 (예: "21:00")');
    if (!Array.isArray(p.sets) || !p.sets.length) { e.push('sets가 비어 있거나 배열이 아닙니다'); return e; }
    var prev = -1;
    p.sets.forEach(function (s, i) {
      var w = (i + 1) + '번째 세트: ';
      if (!s || typeof s !== 'object') { e.push(w + '객체가 아닙니다'); return; }
      if (!s.block) e.push(w + 'block이 없습니다');
      if (!HM.test(s.start || '')) e.push(w + 'start가 24시간제 HH:MM 형식이 아닙니다 (' + s.start + ')');
      else { var t = parseHMS(s.start); if (t <= prev) e.push(w + 'start가 이전 세트보다 빠르거나 같습니다 (' + s.start + ')'); prev = t; }
      if (!(s.reps > 0 && s.reps % 1 === 0)) e.push(w + 'reps가 1 이상의 정수가 아닙니다');
      if (typeof s.kg !== 'number' && !s.label) e.push(w + 'kg(숫자) 또는 label이 필요합니다');
    });
    if (endOk && prev >= 0 && parseHMS(p.end) <= prev) e.push('end가 마지막 세트 시작 시각보다 늦어야 합니다');
    return e.slice(0, 8);
  }
  function handleProgram(p) {
    var errs = validate(p);
    if (errs.length) { fail('program.json 내용 오류', errs); return; }
    start0(p);
  }
  // md 문서에서 프로그램 추출: (1) 코드블록 안 JSON (2) 문서 속 JSON 객체 (3) workout.md 표 형식
  function mdToProgram(text) {
    var re = /```[a-zA-Z]*\s*([\s\S]*?)```/g, m, o;
    while ((m = re.exec(text))) { try { o = JSON.parse(m[1]); if (o && o.sets) return o; } catch (e) {} }
    var a = text.indexOf('{'), b = text.lastIndexOf('}');
    if (a >= 0 && b > a) { try { o = JSON.parse(text.slice(a, b + 1)); if (o && o.sets) return o; } catch (e) {} }
    var p = { dday: 0, title: '', stopRule: '', sets: [] }, block = '', setup = '';
    var pad = function (t) { var q = t.split(':'); return ('0' + q[0]).slice(-2) + ':' + q[1]; };
    var clean = function (t) { return t.replace(/\*\*/g, '').replace(/^[\s*_`]+|[\s*_`]+$/g, ''); };
    text.split(/\r?\n/).forEach(function (ln) {
      var s = ln.trim(), mm, c, w, set, kg;
      if ((mm = s.match(/^#\s+(\d{4}-\d{2}-\d{2})\s*(?:워크아웃)?\s*[-–—:]?\s*(.*)$/))) { p.date = mm[1]; p.title = clean(mm[2]); }
      else if ((mm = s.match(/시간\s*\**\s*[:：]\s*\**\s*(\d{1,2}:\d{2})\s*[~\-–]\s*(\d{1,2}:\d{2})/))) {
        p.start = pad(mm[1]); p.end = pad(mm[2]);
        if ((mm = s.match(/D-(\d+)/i))) p.dday = parseInt(mm[1], 10);
      }
      else if ((mm = s.match(/중단\s*기준\s*\**\s*[:：]\s*(.+)$/))) p.stopRule = clean(mm[1]);
      else if ((mm = s.match(/^##\s+(.+)$/))) { block = clean(mm[1]); setup = ''; }
      else if ((mm = s.match(/^준비\s*\**\s*[:：]\s*(.+)$/))) setup = clean(mm[1]);
      else if (s.charAt(0) === '|' && block) {
        c = s.replace(/^\||\|$/g, '').split('|').map(function (x) { return clean(x); });
        if (c.length >= 2 && /^\d{1,2}:\d{2}$/.test(c[0])) {
          w = c[1].match(/^(.*?)\s*[x×X]\s*(\d+)\s*$/);
          if (!w) return;
          set = { block: block, start: pad(c[0]), reps: parseInt(w[2], 10) };
          kg = w[1].match(/^(\d+(?:\.\d+)?)\s*kg$/i);
          if (kg) set.kg = parseFloat(kg[1]); else set.label = w[1];
          if (c[2]) set.cue = c[2];
          if (setup) { set.setup = setup; setup = ''; }
          p.sets.push(set);
        }
      }
    });
    return p.sets.length ? p : null;
  }
  // 원본 텍스트(JSON 또는 md) -> 프로그램 객체. 실패하면 오류 화면을 띄우고 null.
  function parseAny(raw) {
    var t = (raw || '').trim();
    if (!t) { fail('program.json이 비어 있습니다'); return null; }
    try { return JSON.parse(t); } catch (e) {
      if (t.charAt(0) === '{') { fail('program.json 문법 오류 (JSON 형식이 아닙니다)', [String(e.message || e)]); return null; }
    }
    var p = mdToProgram(t);
    if (!p) fail('파일을 읽을 수 없습니다', ['JSON이 아니고, md 문서에서도 세트 표나 JSON 코드블록을 찾지 못했습니다.', '워크아웃과 함께 만든 program.json 파일을 선택해 주세요.']);
    return p;
  }
  function loadProgram() {
    if (window.Android && Android.getProgram) {
      var p = parseAny(Android.getProgram());
      if (p) handleProgram(p);
    } else {
      fetch('program.json', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { var p = parseAny(t); if (p) handleProgram(p); }, function () { fail('program.json 로드 실패'); });
    }
  }
  // 시간 조정 저장 키: 날짜 + 파일 내용(해시) + 리허설 여부. 파일을 고치면 옛 조정값이 섞이지 않고, 리허설은 실제와 분리된다.
  function hashOf(s) { var h = 5381, i; for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function key() { return (virt !== null ? 'rh-' : 'adj-') + prog.date + '-' + sig; }
  function todayStr() { var d = new Date(), z = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
  function saveOff() { try { localStorage.setItem(key(), JSON.stringify(off)); } catch (e) {} }
  function loadOff() {
    off = prog.sets.map(function () { return 0; });
    try { var o = JSON.parse(localStorage.getItem(key())); if (o && o.length === off.length) off = o; } catch (e) {}
  }

  var S = [], endSec = 0;
  function start(i) { return S[i].base + off[i]; }
  function weight(s) { return (s.kg != null ? s.kg + 'kg' : s.label) + ' x ' + s.reps; }
  function name(s) { return s.block + ' ' + weight(s); }
  function hm(sec) { sec = Math.round(sec / 60) * 60; return Math.floor(sec / 3600) + ':' + ('0' + Math.floor(sec % 3600 / 60)).slice(-2); }
  function mmss(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var s = ('0' + sec % 60).slice(-2), m = Math.floor(sec / 60);
    if (m >= 60) return Math.floor(m / 60) + ':' + ('0' + m % 60).slice(-2) + ':' + s;   // 1시간 이상: H:MM:SS
    return ('0' + m).slice(-2) + ':' + s;
  }
  function $(id) { return document.getElementById(id); }

  var rowEls = [], anchors = [], blocks = [];
  function wt(s) { return s.kg != null ? s.kg + 'kg' : s.label; }
  function buildList() {
    var list = $('list'); list.innerHTML = ''; rowEls = []; anchors = []; blocks = [];
    var lastBlock = null, card = null, bl = null, box = document.createElement('div'); box.id = 'listin'; list.appendChild(box);
    S.forEach(function (s, i) {
      if (s.block !== lastBlock) {
        card = document.createElement('div'); card.className = 'card'; box.appendChild(card);
        var h = document.createElement('div'); h.className = 'bh'; h.innerHTML = '<span></span><em></em>';
        h.firstChild.textContent = s.block; card.appendChild(h); anchors.push(card);
        bl = { em: h.lastChild, idx: [] }; blocks.push(bl); lastBlock = s.block;
      }
      var r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<span class="t"></span><span class="w"></span><span class="r"></span><span class="k"></span>';
      r.querySelector('.w').textContent = wt(s);
      r.querySelector('.r').textContent = '× ' + s.reps;
      card.appendChild(r); rowEls.push(r); anchors.push(r); bl.idx.push(i);
    });
  }

  // 긴 세트 이름은 한 줄에 들어갈 때까지 글자 크기를 줄인다 (기본 화면 높이의 9%, 최소 5%)
  function fitNext(el, text, hi, lo) {
    var key = text + '|' + el.clientWidth;
    if (el.getAttribute('data-t') === key) return;
    el.setAttribute('data-t', key); el.textContent = '';
    var sp = document.createElement('span'); sp.textContent = text; sp.style.whiteSpace = 'nowrap'; el.appendChild(sp);
    var px = window.innerHeight * (hi || 0.06), min = window.innerHeight * (lo || 0.04);
    el.style.fontSize = px + 'px';
    while (sp.offsetLeft + sp.offsetWidth > el.clientWidth && px > min) { px -= 1; el.style.fontSize = px + 'px'; }
  }

  // 동작(큐) 박스: 박스를 넘치면 글자 크기를 줄인다 (기본 5.5%, 최소 3.2%)
  function fitCue(el, text, hi, lo) {
    var k = text + '|' + el.clientHeight;                       // 박스 높이가 바뀌어도 다시 맞춘다
    if (el.getAttribute('data-t') === k) return;
    el.setAttribute('data-t', k); el.textContent = '';
    if (!text) return;
    var sp = document.createElement('span'); sp.textContent = text; el.appendChild(sp);
    var px = window.innerHeight * (hi || 0.055), min = window.innerHeight * (lo || 0.032);
    el.style.fontSize = px + 'px';
    while (sp.offsetHeight > el.clientHeight - 2 && px > min) { px -= 1; el.style.fontSize = px + 'px'; }
  }

  var lastCur = -2, lastTick = '';
  function scrollTo(cur) {
    var list = $('list'), inner = $('listin');
    var max = Math.max(0, inner.scrollHeight - list.clientHeight);
    var want = cur >= 0 ? rowEls[cur].offsetTop - list.clientHeight * 0.2 : 0;
    want = Math.max(0, Math.min(want, max));
    // 행/블록 제목 경계에 맞춰 스크롤해서 위쪽 글자가 반쯤 잘리지 않게 한다
    var kids = anchors, snap = 0;
    for (var k = 0; k < kids.length; k++) { if (kids[k].offsetTop >= want) { snap = kids[k].offsetTop; break; } snap = max; }
    snap = Math.min(snap, max);
    if (cur >= 0 && rowEls[cur].offsetTop - snap > list.clientHeight - rowEls[cur].offsetHeight) snap = want;
    list.scrollTo({ top: snap, behavior: lastCur === -2 ? 'auto' : 'smooth' });   // 직접 스크롤도 가능, 세트가 바뀔 때만 자동 이동
  }

  function render() {
    var now = nowSec(), n = S.length, cur = -1, nxt = n, i;
    for (i = 0; i < n; i++) { if (start(i) <= now) cur = i; else { nxt = i; break; } }
    var endAdj = endSec + off[n - 1];
    var ended = cur === n - 1 && now >= endAdj;
    document.body.classList.toggle('ended', ended);

    var doneN = 0;
    for (var j = 0; j < n; j++) {
      var done = j < cur || (j === cur && ended);
      if (done) doneN++;
      rowEls[j].className = 'row' + (done ? ' done' : j === cur ? ' cur' : j === nxt ? ' next' : '');
      rowEls[j].querySelector('.t').textContent = hm(start(j));
      rowEls[j].querySelector('.k').innerHTML = done ? '✓' : j === cur ? '<b>진행 중</b>' : j === nxt ? '<b>다음</b>' : '';
    }
    blocks.forEach(function (b) {
      var d = b.idx.filter(function (x) { return x < cur || (x === cur && ended); }).length;
      b.em.textContent = d + '/' + b.idx.length;
    });
    $('pcount').textContent = '완료 ' + doneN + '/' + n;
    $('prog').firstElementChild.style.width = (doneN / n * 100) + '%';
    if (cur !== lastCur) {
      scrollTo(cur);
      if (lastCur !== -2 && cur > lastCur && cur >= 0) beep(880, 0.35);   // 세트 시작 신호음
      lastCur = cur;
    }
    $('warn').style.display = (virt === null && prog.date !== todayStr()) ? 'inline-block' : 'none';   // 어제 파일 등 날짜 불일치 경고
    if (ended) { $('finsum').textContent = '완료 세트 ' + n + '/' + n; return; }

    if (cur >= 0) fitNext($('cur'), name(S[cur]), 0.08, 0.045); else { $('cur').removeAttribute('data-t'); $('cur').style.fontSize = ''; $('cur').textContent = '대기 중'; }
    fitCue($('curcue'), cur >= 0 && S[cur].cue ? S[cur].cue : '', 0.06, 0.032);
    $('nowbox').className = cur >= 0 ? '' : 'idle';
    $('nextlab').className = '';
    var rem, frac;
    if (nxt < n) {
      var chg = cur < 0 || S[cur].block !== S[nxt].block;       // 블록이 바뀌면 알림
      $('nextlab').innerHTML = hm(start(nxt)) + ' 시작' + (chg ? '<b>새 블록 · ' + S[nxt].block + '</b>' : '');
      fitNext($('next'), name(S[nxt]));
      rem = start(nxt) - now;
      var tk = Math.ceil(rem);                                    // 시작 3·2·1초 전 짧은 신호음 (초마다 한 번)
      if (tk >= 1 && tk <= 3 && lastTick !== nxt + ':' + tk) { lastTick = nxt + ':' + tk; beep(660, 0.12); }
      var from = cur >= 0 ? start(cur) : start(nxt) - 600;
      frac = (now - from) / (start(nxt) - from);
      var aft = nxt + 1 < n ? S[nxt + 1] : null;
      $('after').textContent = aft ? '그다음: ' + name(aft) + ' · ' + hm(start(nxt + 1)) : '그다음: 없음 (마지막 세트)';
    } else {
      $('nextlab').className = 'last'; $('nextlab').textContent = '마지막 세트 진행 중';
      fitNext($('next'), '종료까지');
      rem = endAdj - now;
      frac = (now - start(cur)) / (endAdj - start(cur));
      $('after').textContent = '';
    }
    var cls = rem < 10 ? 'bad' : rem < 60 ? 'warn' : '';
    var ct = mmss(rem), ce = $('count');
    if (ce.getAttribute('data-n') !== String(ct.length)) {      // 자릿수가 바뀔 때만 글자 크기 재조정 (기본 24%)
      ce.setAttribute('data-n', ct.length); ce.textContent = ct;
      var cpx = window.innerHeight * 0.24, cmin = window.innerHeight * 0.1;
      ce.style.fontSize = cpx + 'px';
      while (ce.scrollWidth > ce.clientWidth && cpx > cmin) { cpx -= 2; ce.style.fontSize = cpx + 'px'; }
    }
    ce.textContent = ct;
    $('count').className = cls; $('bar').className = cls;
    $('bar').firstElementChild.style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
    $('stop').textContent = prog.stopRule ? '중단 기준: ' + prog.stopRule : '';
  }

  var ac = null;
  function unlockAudio() {          // 자동재생 제한 대비: 첫 터치에서 오디오를 미리 활성화
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  document.addEventListener('touchstart', unlockAudio, true);
  document.addEventListener('click', unlockAudio, true);
  window.__beeps = [];                                            // 디버그: 울린 신호음 기록
  function beep(freq, dur) {
    window.__beeps.push(freq);
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = freq; g.gain.value = 0.4;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  // 되돌리기: 조정 직전 상태를 6초간 보관
  var lastOff = null, undoTimer = null;
  function hideUndo() { clearTimeout(undoTimer); lastOff = null; $('undo').style.display = 'none'; }
  function pushUndo() {
    lastOff = off.slice(); $('undo').style.display = 'flex';
    clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 6000);
  }
  $('undoBtn').addEventListener('click', function () {
    if (lastOff) { off = lastOff; saveOff(); render(); }
    hideUndo();
  });

  function adjust(delta) {                       // 아직 시작 안 한 세트에만 적용
    var now = nowSec();
    pushUndo();
    for (var i = 0; i < S.length; i++) if (start(i) > now) off[i] += delta;
    saveOff(); render();
  }
  function startNow() {                          // 다음 세트를 지금으로, 이후 세트도 같은 만큼
    var t = nowSec(), nxt = -1, i;
    for (i = 0; i < S.length; i++) if (start(i) > t) { nxt = i; break; }
    if (nxt < 0) return;
    pushUndo();
    var d = Math.ceil(t) - start(nxt);
    for (i = nxt; i < S.length; i++) off[i] += d;
    saveOff(); render();
  }
  document.querySelectorAll('#ctrl button[data-d]').forEach(function (b) {
    b.addEventListener('click', function () { adjust(parseInt(b.getAttribute('data-d'), 10)); });
  });
  $('go').addEventListener('click', startNow);
  $('prev').addEventListener('click', function () {   // 잘못 넘겼을 때: 직전 세트를 지금 다시 시작, 이후 세트도 같은 만큼 뒤로
    var t = nowSec(), cur = -1, i;
    for (i = 0; i < S.length; i++) if (start(i) <= t) cur = i;
    if (cur < 0) return;
    var tgt = cur > 0 ? cur - 1 : 0;
    pushUndo();
    var d = Math.ceil(t) - start(tgt);
    for (i = tgt; i < S.length; i++) off[i] += d;
    saveOff(); render();
  });
  // 리허설: 첫 세트 10초 전 시각으로 되돌려 처음부터 다시 진행. 다시 누르면 실시간.
  $('reh').addEventListener('click', function () {
    hideUndo();
    if (virt !== null) { virt = null; loadOff(); }            // 실시간 복귀: 실제 조정값 복원
    else {
      virt = S[0].base - 10; t0 = Date.now();                  // 리허설: 별도 저장소(rh-)를 0으로 시작
      off = S.map(function () { return 0; }); saveOff();
    }
    lastCur = -2; $('reh').textContent = virt !== null ? '실시간' : '리허설';
    document.body.classList.toggle('rehearsal', virt !== null);
    scrollTo(-1); render();
  });
  if (virt !== null) { $('reh').textContent = '실시간'; document.body.classList.add('rehearsal'); }
  syncThemeBtn();
  $('dk').addEventListener('click', function () {
    var dark = document.body.classList.toggle('dark');
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
    syncThemeBtn();
  });
  $('imp').addEventListener('click', function () { if (window.Android && Android.importProgram) Android.importProgram(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function start0(p) {
    prog = p;
    sig = hashOf(JSON.stringify(p.sets));
    S = p.sets.map(function (s) { var o = {}; for (var k in s) o[k] = s[k]; o.base = parseHMS(s.start); return o; });
    endSec = parseHMS(p.end);
    loadOff();
    var d = new Date(p.date + 'T00:00:00'), wd = '일월화수목금토'.charAt(d.getDay());
    $('date').textContent = (d.getMonth() + 1) + '/' + d.getDate() + '(' + wd + ')';
    $('chip').textContent = p.dday != null ? 'D-' + p.dday : '';
    $('chip').style.display = p.dday != null ? '' : 'none';
    $('rng').textContent = (p.start || p.sets[0].start).replace(/^0/, '') + '~' + p.end.replace(/^0/, '');
    $('ttl').textContent = p.title || '';
    buildList(); render();
    setInterval(render, 200);
  }
  // 화면 크기가 바뀌면 글자 크기 캐시를 비우고 다시 계산 (px 기준 자동 축소 때문)
  window.addEventListener('resize', function () {
    ['cur', 'next', 'curcue', 'count'].forEach(function (id) { var el = $(id); if (el) { el.removeAttribute('data-t'); el.removeAttribute('data-n'); } });
    if (prog) { lastCur = -2; render(); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { window.dispatchEvent(new Event('resize')); });
  loadProgram();
})();
</script>
