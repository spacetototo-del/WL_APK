<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>역도 타이머</title>
<style>
  :root { --bg:#fff; --fg:#111; --dim:#9a9a9a; --line:#d9d9d9; --hi:#ffe27a; --hi-fg:#111; --ok:#1f8a3b; --warn:#f08a00; --bad:#d8201a; --panel:#f4f4f4; }
  body.dark { --bg:#0e0e10; --fg:#f2f2f2; --dim:#6d6d73; --line:#2a2a2e; --hi:#5a4a00; --hi-fg:#fff; --panel:#1a1a1d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  #app { display:flex; width:100vw; height:100vh; }
  #left,#right { width:50vw; height:100vh; padding:2vh 1.6vw; display:flex; flex-direction:column; }
  #left { border-right:.4vh solid var(--line); }

  /* 좌측 */
  #head { font-size:3.4vh; font-weight:700; padding-bottom:1.2vh; border-bottom:.4vh solid var(--fg); white-space:nowrap; }
  #title { font-size:2.4vh; color:var(--dim); font-weight:500; padding:.6vh 0 .8vh; }
  #list { flex:1; overflow:hidden; position:relative; }
  #listin { transition:transform .4s; }
  .blk { font-size:2.2vh; font-weight:700; letter-spacing:.1em; color:var(--dim); padding:1.1vh 0 .3vh; }
  .row { display:flex; align-items:center; gap:1.2vw; font-size:3vh; line-height:1; padding:.85vh 1vw; border-radius:.8vh; }
  .row .t { width:6.4vw; font-variant-numeric:tabular-nums; color:var(--dim); }
  .row .w { flex:1; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .k { width:2.4vw; text-align:center; color:var(--ok); font-weight:800; }
  .row.done { color:var(--dim); } .row.done .w { font-weight:400; text-decoration:line-through; }
  .row.cur { background:var(--hi); color:var(--hi-fg); font-weight:800; } .row.cur .t { color:var(--hi-fg); }

  /* 우측 */
  #right { justify-content:space-between; }
  #cur { font-size:3vh; color:var(--dim); min-height:3.6vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #nextlab { font-size:2.6vh; color:var(--dim); margin-top:1vh; }
  #next { font-size:9vh; font-weight:800; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #cue { font-size:3.2vh; min-height:4.2vh; margin-top:.4vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #count { font-size:24vh; font-weight:800; line-height:1; text-align:center; font-variant-numeric:tabular-nums; margin:1vh 0; }
  #count.warn { color:var(--warn); } #count.bad { color:var(--bad); }
  #bar { height:2.4vh; background:var(--panel); border-radius:1.2vh; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--ok); }
  #bar.warn i { background:var(--warn); } #bar.bad i { background:var(--bad); }
  #after { font-size:3vh; margin-top:1.6vh; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #stop { font-size:2.5vh; color:var(--bad); font-weight:700; margin-top:.8vh; line-height:1.25; }
  #ctrl { display:flex; gap:.8vw; margin-top:1.4vh; }
  #ctrl button { flex:1; font:inherit; font-size:2.4vh; padding:1.3vh 0; background:var(--panel); color:var(--fg); border:.3vh solid var(--line); border-radius:1vh; }
  #ctrl button.go { flex:2; background:var(--fg); color:var(--bg); font-weight:700; }
  #ctrl button.sm { flex:.7; color:var(--dim); }
  #ctrl button:active { opacity:.6; }
  #fin { display:none; text-align:center; }
  #fin b { display:block; font-size:8vh; margin-top:10vh; } #fin span { display:block; font-size:4vh; margin-top:3vh; color:var(--dim); }
  body.ended #main { display:none; } body.ended #fin { display:block; }
  #err { padding:4vh; font-size:4vh; color:var(--bad); }
</style>
</head>
<body>
<div id="app">
  <section id="left">
    <div id="head">-</div>
    <div id="title"></div>
    <div id="list"></div>
  </section>
  <section id="right">
    <div id="main">
      <div id="cur"></div>
      <div id="nextlab">다음</div>
      <div id="next">-</div>
      <div id="cue"></div>
      <div id="count">--:--</div>
      <div id="bar"><i></i></div>
      <div id="after"></div>
      <div id="stop"></div>
    </div>
    <div id="fin"><b>종료 · 수고하셨습니다</b><span id="finsum"></span></div>
    <div id="ctrl">
      <button data-d="-60">-1분</button>
      <button data-d="60">+1분</button>
      <button data-d="300">+5분</button>
      <button class="go" id="go">다음 세트 지금 시작</button>
      <button class="sm" id="imp">파일</button>
    </div>
  </section>
</div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  if (Q.get('theme') === 'dark') document.body.classList.add('dark');

  // 가상 시각(리허설용): ?t=07:29:50&speed=10
  var speed = parseFloat(Q.get('speed')) || 1, t0 = Date.now();
  function parseHMS(s) { var p = s.split(':').map(Number); return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0); }
  var virt = Q.get('t') ? parseHMS(Q.get('t')) : null;
  function nowSec() {
    if (virt !== null) return virt + (Date.now() - t0) / 1000 * speed;
    var d = new Date(); return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds() + d.getMilliseconds() / 1000;
  }
  window.__setVirt = function (s) { virt = parseHMS(s); t0 = Date.now(); };   // 디버그용

  var prog = null, off = [];
  function fail(m) { document.getElementById('app').innerHTML = '<div id="err">' + m + '</div>'; }
  function loadProgram(cb) {
    if (window.Android && Android.getProgram) {
      try { cb(JSON.parse(Android.getProgram())); } catch (e) { fail('program.json 오류'); }
    } else {
      fetch('program.json').then(function (r) { return r.json(); }).then(cb).catch(function () { fail('program.json 로드 실패'); });
    }
  }
  function key() { return 'adj-' + prog.date; }
  function saveOff() { try { localStorage.setItem(key(), JSON.stringify(off)); } catch (e) {} }
  function loadOff() {
    off = prog.sets.map(function () { return 0; });
    try { var o = JSON.parse(localStorage.getItem(key())); if (o && o.length === off.length) off = o; } catch (e) {}
  }

  var S = [], endSec = 0;
  function start(i) { return S[i].base + off[i]; }
  function weight(s) { return (s.kg != null ? s.kg + 'kg' : s.label) + ' x ' + s.reps; }
  function name(s) { return s.block + ' ' + weight(s); }
  function hm(sec) { sec = Math.round(sec / 60) * 60; return Math.floor(sec / 3600) + ':' + ('0' + Math.floor(sec % 3600 / 60)).slice(-2); }
  function mmss(sec) { sec = Math.max(0, Math.ceil(sec)); return ('0' + Math.floor(sec / 60)).slice(-2) + ':' + ('0' + sec % 60).slice(-2); }
  function $(id) { return document.getElementById(id); }

  var rowEls = [];
  function buildList() {
    var list = $('list'); list.innerHTML = ''; rowEls = [];
    var lastBlock = null, box = document.createElement('div'); box.id = 'listin'; list.appendChild(box);
    S.forEach(function (s) {
      if (s.block !== lastBlock) { var b = document.createElement('div'); b.className = 'blk'; b.textContent = s.block; box.appendChild(b); lastBlock = s.block; }
      var r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<span class="t"></span><span class="w"></span><span class="k"></span>';
      r.querySelector('.w').textContent = weight(s);
      box.appendChild(r); rowEls.push(r);
    });
  }

  // 긴 세트 이름은 한 줄에 들어갈 때까지 글자 크기를 줄인다 (기본 화면 높이의 9%, 최소 5%)
  function fitNext(el, text) {
    if (el.getAttribute('data-t') === text) return;
    el.setAttribute('data-t', text); el.textContent = text;
    var px = window.innerHeight * 0.09, min = window.innerHeight * 0.05;
    el.style.fontSize = px + 'px';
    while (el.scrollWidth > el.clientWidth && px > min) { px -= 1; el.style.fontSize = px + 'px'; }
  }

  var lastCur = -2;
  function scrollTo(cur) {
    var list = $('list'), inner = $('listin');
    var max = Math.max(0, inner.scrollHeight - list.clientHeight);
    var want = cur >= 0 ? rowEls[cur].offsetTop - list.clientHeight * 0.35 : 0;
    inner.style.transform = 'translateY(' + (-Math.max(0, Math.min(want, max))) + 'px)';
  }

  function render() {
    var now = nowSec(), n = S.length, cur = -1, nxt = n, i;
    for (i = 0; i < n; i++) { if (start(i) <= now) cur = i; else { nxt = i; break; } }
    var endAdj = endSec + off[n - 1];
    var ended = cur === n - 1 && now >= endAdj;
    document.body.classList.toggle('ended', ended);

    for (var j = 0; j < n; j++) {
      var done = j < cur || (j === cur && ended);
      rowEls[j].className = 'row' + (done ? ' done' : j === cur ? ' cur' : '');
      rowEls[j].querySelector('.t').textContent = hm(start(j));
      rowEls[j].querySelector('.k').textContent = done ? '✓' : '';
    }
    if (cur !== lastCur) {
      scrollTo(cur);
      if (lastCur !== -2 && cur > lastCur && cur >= 0) beep(880, 0.35);   // 세트 시작 신호음
      lastCur = cur;
    }
    if (ended) { $('finsum').textContent = '완료 세트 ' + n + '/' + n; return; }

    $('cur').textContent = cur >= 0 ? '진행 중: ' + name(S[cur]) : '대기 중';
    var rem, frac;
    if (nxt < n) {
      $('nextlab').textContent = '다음 · ' + hm(start(nxt)) + ' 시작';
      fitNext($('next'), name(S[nxt]));
      $('cue').textContent = S[nxt].cue || '';
      rem = start(nxt) - now;
      var from = cur >= 0 ? start(cur) : start(nxt) - 600;
      frac = (now - from) / (start(nxt) - from);
      var aft = nxt + 1 < n ? S[nxt + 1] : null;
      $('after').textContent = aft ? '그다음: ' + weight(aft) + ' · ' + hm(start(nxt + 1)) : '그다음: 없음 (마지막 세트)';
    } else {
      $('nextlab').textContent = '마지막 세트 진행 중';
      fitNext($('next'), '종료까지');
      $('cue').textContent = S[cur].cue || '';
      rem = endAdj - now;
      frac = (now - start(cur)) / (endAdj - start(cur));
      $('after').textContent = '';
    }
    var cls = rem < 10 ? 'bad' : rem < 60 ? 'warn' : '';
    $('count').textContent = mmss(rem);
    $('count').className = cls; $('bar').className = cls;
    $('bar').firstElementChild.style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
    $('stop').textContent = prog.stopRule ? '중단 기준: ' + prog.stopRule : '';
  }

  var ac = null;
  function beep(freq, dur) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = freq; g.gain.value = 0.4;
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
    } catch (e) {}
  }

  function adjust(delta) {                       // 아직 시작 안 한 세트에만 적용
    var now = nowSec();
    for (var i = 0; i < S.length; i++) if (start(i) > now) off[i] += delta;
    saveOff(); render();
  }
  function startNow() {                          // 다음 세트를 지금으로, 이후 세트도 같은 만큼
    var t = nowSec(), nxt = -1, i;
    for (i = 0; i < S.length; i++) if (start(i) > t) { nxt = i; break; }
    if (nxt < 0) return;
    var d = Math.ceil(t) - start(nxt);
    for (i = nxt; i < S.length; i++) off[i] += d;
    saveOff(); render();
  }
  document.querySelectorAll('#ctrl button[data-d]').forEach(function (b) {
    b.addEventListener('click', function () { adjust(parseInt(b.getAttribute('data-d'), 10)); });
  });
  $('go').addEventListener('click', startNow);
  $('imp').addEventListener('click', function () { if (window.Android && Android.importProgram) Android.importProgram(); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  loadProgram(function (p) {
    prog = p;
    S = p.sets.map(function (s) { var o = {}; for (var k in s) o[k] = s[k]; o.base = parseHMS(s.start); return o; });
    endSec = parseHMS(p.end);
    loadOff();
    var d = new Date(p.date + 'T00:00:00'), wd = '일월화수목금토'.charAt(d.getDay());
    $('head').textContent = (d.getMonth() + 1) + '/' + d.getDate() + '(' + wd + ') · D-' + p.dday + ' · ' + (p.start || p.sets[0].start).replace(/^0/, '') + '~' + p.end.replace(/^0/, '');
    $('title').textContent = p.title || '';
    buildList(); render();
    setInterval(render, 200);
  });
})();
</script>
</body>
</html>
